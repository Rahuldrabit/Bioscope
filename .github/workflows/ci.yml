name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bioscope
          POSTGRES_USER: bioscope
          POSTGRES_PASSWORD: bioscope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bioscope -d bioscope"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://bioscope:bioscope@localhost:5432/bioscope
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.11"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install backend dependencies
        run: uv sync --project services/backend --all-groups --frozen
      - name: Install frontend dependencies
        run: pnpm --dir apps/web install --frozen-lockfile
      - name: Apply migration in a clean database
        run: uv run --project services/backend alembic -c services/backend/alembic.ini upgrade head
      - name: Regenerate OpenAPI client
        run: make generate-api
      - name: Backend lint and tests
        run: |
          uv run --project services/backend ruff check services/backend/src services/backend/tests
          uv run --project services/backend pyright --project services/backend/pyproject.toml
          uv run --project services/backend pytest services/backend/tests
      - name: Frontend lint, typecheck, unit tests and build
        run: |
          pnpm --dir apps/web lint
          pnpm --dir apps/web typecheck
          pnpm --dir apps/web test
          pnpm --dir apps/web build
      - name: Container build and web runtime smoke
        run: |
          docker build --file services/backend/Dockerfile --tag bioscope-backend:ci services/backend
          docker build --file apps/web/Dockerfile --tag bioscope-web:ci .
          container_id=$(docker run --detach --publish 3000:3000 bioscope-web:ci)
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/ >/dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done
          docker rm --force "$container_id"
          trap - EXIT
      - name: Browser smoke
        run: |
          pnpm --dir apps/web exec playwright install --with-deps chromium
          pnpm --dir apps/web test:e2e
      - name: Assert generated client is current
        run: git diff --exit-code -- apps/web/src/shared/api/generated/schema.ts
