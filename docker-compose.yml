name: bioscope

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bioscope
      POSTGRES_USER: bioscope
      POSTGRES_PASSWORD: bioscope
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioscope -d bioscope"]
      interval: 5s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >-
      /bin/sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin;
      do sleep 1; done &&
      mc mb --ignore-existing local/bioscope-private"

  api:
    build:
      context: ./services/backend
    environment:
      APP_ENV: development
      DEMO_MODE: "true"
      DATABASE_URL: postgresql+asyncpg://bioscope:bioscope@postgres:5432/bioscope
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: bioscope-private
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      API_CORS_ORIGINS: '["http://localhost:3000"]'
      ENABLE_EXTERNAL_SOURCES: "false"
      ENABLE_SKIN_IMAGE_UPLOAD: "false"
      ENABLE_NUMERIC_CONFIDENCE: "false"
    command: >-
      sh -c "uv run alembic upgrade head &&
      uv run fastapi run src/bioscope/main.py --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 12
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./services/backend
    environment:
      APP_ENV: development
      DEMO_MODE: "true"
      DATABASE_URL: postgresql+asyncpg://bioscope:bioscope@postgres:5432/bioscope
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: bioscope-private
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      ENABLE_EXTERNAL_SOURCES: "false"
      ENABLE_SKIN_IMAGE_UPLOAD: "false"
      ENABLE_NUMERIC_CONFIDENCE: "false"
    command: uv run python -m bioscope.workers.entrypoint
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
